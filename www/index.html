<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, user-scalable=no">
    <title>Eco Mart - Arcade Idle</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="layer-background"></canvas>
        <canvas id="layer-gameplay"></canvas>
        <canvas id="layer-ui"></canvas>
    </div>

    <!-- Ekran ładowania - w HTML/CSS od razu, WIDOCZNY zanim jakikolwiek JS
         zdąży się wykonać (żadnego migotania pustego/niedoładowanego
         tła+dekoracji na starcie). main.js chowa go dopiero, gdy wszystkie
         tekstury/sprite'y są gotowe (patrz Game.assetsReady/
         PlayerController.spritesReady) - i to z zapasem: minimalny czas
         wyświetlania + kilka klatek "osiadania" PO gotowości assetów, żeby
         jednorazowe pieczenie tła świata (Game._bakeWorldBackground) zdążyło
         się skończyć POD ekranem, zamiast być widoczne jako zacięcie zaraz
         po jego zniknięciu (patrz LOADING_SCREEN_MIN_MS w main.js). -->
    <div id="loading-screen">
        <div class="loading-screen__content">
            <div class="loading-screen__badge" aria-hidden="true">♻️</div>
            <div class="loading-screen__title">Eco Mart</div>
            <div class="loading-screen__subtitle">Arcade Idle</div>
            <div class="loading-screen__bar">
                <div class="loading-screen__bar-fill" id="loading-bar-fill"></div>
            </div>
            <div class="loading-screen__tip" id="loading-tip">Sadzimy trawę…</div>
        </div>
    </div>
    <!-- Czysto kosmetyczny (pasek + rotujące podpowiedzi) - CELOWO inline i
         PRZED resztą JS, żeby działał od razu, zero zależności od Bus/reszty
         gry. Prawdziwe ukrycie ekranu (main.js/hideLoadingScreenWhenReady)
         nie czeka na ten skrypt - jeśli coś tu pójdzie nie tak, ekran i tak
         zniknie normalnie, tylko bez animacji paska. -->
    <script>
    (function () {
        var tips = [
            'Sadzimy trawę…',
            'Ustawiamy maszyny…',
            'Rozkładamy stragan…',
            'Pakujemy plecak…',
            'Szykujemy statek…'
        ];
        var tipEl = document.getElementById('loading-tip');
        if (tipEl) {
            var tipIndex = 0;
            setInterval(function () {
                tipIndex = (tipIndex + 1) % tips.length;
                tipEl.textContent = tips[tipIndex];
            }, 1300);
        }
        // Pasek rośnie "na oko" do 92% - prawdziwy postęp wczytywania
        // assetów nie jest tu (jeszcze) znany, main.js dociąga go do 100%
        // tuż przed schowaniem ekranu. Spowalniające tempo (ease-out ręcznie)
        // sprawia, że pasek NIGDY nie wygląda na utknięty w miejscu, nawet
        // przy dłuższym ładowaniu.
        var fillEl = document.getElementById('loading-bar-fill');
        if (fillEl) {
            var pct = 0;
            window.__loadingBarGrowInterval = setInterval(function () {
                pct = Math.min(92, pct + (92 - pct) * 0.06 + 0.4);
                fillEl.style.width = pct + '%';
            }, 90);
        }
    })();
    </script>

    <!-- KOLEJNOŚĆ WAŻNA — nie zmieniaj -->
    <script src="js/eventbus.js"></script>
    <script src="js/audio.js"></script>
    <!-- Bundlowany osobno (esbuild) - JEDYNY plik w projekcie z importem
         npm (@capacitor-community/admob). Nieobecny/nieszkodliwy podczas
         zwykłego testowania w przeglądarce (Live Server) - patrz README-ADS.md.
         Musi ładować się PRZED ads.js, który sprawdza czy window.NativeAds istnieje. -->
    <script src="js/native-ads.bundle.js"></script>
    <script src="js/ads.js"></script>
    <script src="js/save.js"></script>
    <script src="js/economy.js"></script>
    <script src="js/sprites.js"></script>
    <!-- Ambient particles per biom (czysto dekoracyjne, zero assetów) -
         przed game.js, bo main.js rejestruje AmbientManager jako moduł. -->
    <script src="js/ambient.js"></script>
    <!-- Drobne stworzenia (motyle/świetliki/wrony) - ten sam wzorzec co
         ambient.js, przed game.js bo main.js rejestruje CrittersManager. -->
    <script src="js/critters.js"></script>
    <script src="js/items.js"></script>
    <!-- Minimapa (ulepszenie, dawniej Kompas Surowców) - po items.js, bo
         czyta window.itemManager.items i ItemRenderer.getTypeMeta(). -->
    <script src="js/minimap.js"></script>
    <script src="js/gamefeel.js"></script>
    <script src="js/machines.js"></script>
    <script src="js/market.js"></script>
    <script src="js/ship.js"></script>
    <script src="js/stacking.js"></script>
    <script src="js/player.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/tutorial.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
